<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the provider service) may own the name -->
  <policy user="root">
    <allow own="org.cachyos.TdpProvider"/>
    <allow send_destination="org.cachyos.TdpProvider"/>
  </policy>
  <!-- steamos-manager's per-user daemon relays Steam's slider; it runs as the desktop user -->
  <policy user="@USER@">
    <allow send_destination="org.cachyos.TdpProvider"/>
  </policy>
</busconfig>
